name: Build FloatingTimer

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Compilar o FloatingTimer
        run: |
          xcrun -sdk iphoneos clang -dynamiclib -arch arm64 -fobjc-arc \
            -miphoneos-version-min=12.0 \
            -framework UIKit -framework Foundation \
            -framework QuartzCore -framework CoreGraphics \
            -o FloatingTimer.dylib FloatingTimer.m
          file FloatingTimer.dylib

      - name: Guardar o resultado
        uses: actions/upload-artifact@v4
        with:
          name: FloatingTimer-dylib
          path: FloatingTimer.dylib
